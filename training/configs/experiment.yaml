# ===============================
# TRAINING SETTINGS
# ===============================
num_folds: 4
batch_size: 32
epochs_per_fold: 25

# ===============================
# OPTIMIZER SETTINGS
# ===============================
optimizer:
  type: adamw        # adam | adamw | sgd
  lr: 1e-4
  weight_decay: 1e-4

# ===============================
# DATA SETTINGS
# ===============================
data:
  metadata_csv: "dataset/metadata.csv"
  folds_csv: "dataset/folds.csv"

  # Normalization statistics (OPT + SAR only)
  normalization_stats_opt_sar_csv: "dataset/normalization_stats_opt_sar.csv"

  # NOTE:
  # PRISMA is used only via PCA embeddings (see prisma_pca below).

  augment: true
  normalize: true

  # Input channels
  sar_channels: 1
  planet_channels: 8
  prisma_channels: 230   # PRISMA hyperspectral bands (conditioning only)

  # ===============================
  # PRISMA PCA (ONLY supported PRISMA pathway)
  # ===============================
  prisma_pca:
    enabled: true              # MUST be true if model.use_prisma = true
    n_components: 16           # e.g. 8 / 16 / 32
    weights_dir: "dataset/prisma_pca_weights/"

# ===============================
# MODEL SETTINGS
# ===============================
model:
  # Architecture choice
  fusion_type: late    # single | early | mid | late

  # Used only if fusion_type: single
  sensor_type: planet        # sar | planet

  # PRISMA FiLM conditioning
  use_prisma: true      
  # Classification settings
  num_classes: 1
  dropout: 0.2
  pool_type: avg          # avg | max | avgmax

  # Backbone (fixed)
  pretrained: true        # torchvision ResNet18 pretrained weights

# ===============================
# LOGGING, SAVING, CHECKPOINTS
# ===============================
save_dir: "training/checkpoints/"
inference_save_dir: "inference/predictions/"
save_every: 1
eval_every: 1

# ===============================
# PATCH GEOMETRY
# ===============================
patch:
  size: 224
  stride: 179