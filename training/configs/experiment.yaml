# ===============================
# TRAINING SETTINGS
# ===============================
num_folds: 4
batch_size: 32
epochs_per_fold: 25

# ===============================
# OPTIMIZER SETTINGS
# ===============================
optimizer:
  type: adamw        # adam | adamw | sgd
  lr: 1e-4
  weight_decay: 1e-4

# ===============================
# DATA SETTINGS
# ===============================
data:
  metadata_csv: "dataset/metadata.csv"
  folds_csv: "dataset/folds.csv"

  # Normalization statistics (OPT + SAR only)
  normalization_stats_opt_sar_csv: "dataset/normalization_stats_opt_sar.csv"

  # NOTE:
  # PRISMA is used only via PCA embeddings (see prisma_pca below).

  augment: true
  normalize: true

  # NOTE:
  # PRISMA patches are assumed to be ALREADY reduced via PCA offline.
  # The dataset loads PCA-reduced PRISMA patches directly (no PCA at runtime).
  prisma_channels: 16   # PRISMA components extracted through PCA
  sar_channels: 1
  planet_channels: 8

# ===============================
# MODEL SETTINGS
# ===============================
model:
  # Architecture choice
  fusion_type: mid    # single | early | mid | late

  # Used only if fusion_type: single
  sensor_type: sar        # sar | planet

  # PRISMA PCA reduced components
  use_prisma: true   

  # Classification settings
  num_classes: 1
  dropout: 0.2
  pool_type: avg          # avg | max | avgmax

  # Backbone (fixed)
  pretrained: true        # torchvision ResNet18 pretrained weights

# ===============================
# LOGGING, SAVING, CHECKPOINTS
# ===============================
save_dir: "training/checkpoints/"
inference_save_dir: "inference/predictions/"
save_every: 1
eval_every: 1

# ===============================
# PATCH GEOMETRY
# ===============================
patch:
  size: 224
  stride: 179